services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kosmanager
      MYSQL_USER: kos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      # Default: local working tree. Override untuk build dari remote:
      #   KOS_API_CONTEXT=https://github.com/RakhaYandra/kosmanager-dotnet.git docker compose up
      context: ${KOS_API_CONTEXT:-../../api}
      dockerfile: KosManager.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONN: "server=mysql;port=3306;database=kosmanager;user=kos;password=${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET min 32 char}
      NOTIFY_CHANNEL: mock
    ports:
      - "8090:8090"

volumes:
  mysql-data: {}
